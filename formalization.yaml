version: "v0.4"

project:
  name: "Serrin epigraph monotonicity and rigidity"
  description: >-
    Lean 4 and Mathlib proofs of three theorems on Serrin's overdetermined
    problem in epigraphs. Let Ω ⊂ ℝⁿ, n ≥ 2, be the epigraph of a continuously
    differentiable function g on ℝⁿ⁻¹, and let u be positive, twice continuously
    differentiable in Ω and continuously differentiable up to the boundary, with
    −Δu = f(u) in Ω, u = 0 on ∂Ω, and outward normal derivative equal to a
    negative constant on ∂Ω. The reaction f is continuously differentiable on
    [0, ∞) and satisfies f(s) − s f′(s) ≥ 0 for s > 0. (1) If
    log(1 + ∫_{Ω∩B_R} u²)/R has liminf zero as R → ∞, then the vertical
    derivative ∂u/∂xₙ is positive throughout Ω. (2) If moreover f > 0 on (0, 1),
    f(1) = 0, f′(1) < 0 and u < 1, and n ≤ 8, then g is affine and u depends
    only on the distance to the hyperplane ∂Ω. (3) Under the assumptions of (2)
    with n ≥ 9 instead, the same conclusion holds when g has a global linear
    lower bound or a global linear upper bound. Theorems (2) and (3) are the
    rigidity theorem of Beuvin and Farina for vertically monotone solutions
    (arXiv:2502.04812, Theorem 2.1, which builds on work of Wang and Wei), with
    the monotonicity hypothesis removed by theorem (1), for this class of
    reactions. Every step is proved in Lean from Mathlib, using only the
    standard axioms.
  authors: ["Yongxi (Aaron) Lin"]
  license: "Apache-2.0"
  responsible_maintainers: ["Yongxi (Aaron) Lin"]

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35J61", "35N25", "35B06", "35R35", "49Q05"]

sources:
  - title: "Epigraph monotonicity and rigidity statements (unpublished ChatGPT conversation directed by the author)"
    type: "other"
    authors: ["Yongxi (Aaron) Lin"]
    contributors:
      - name: "ChatGPT (OpenAI)"
        role: "Drafted the three statements, including the two rigidity corollaries and the reasoning and citations given for them, in a conversation directed by the author."
    location: "docs/source"
    relationship: "formalizes"
    note: >-
      ChatGPT drafted the three statements in an unpublished conversation that
      the author directed, titled “查找近期相关文献”; docs/source reproduces the
      relevant answers as images. The author selected the statements for
      formalization and is responsible for them. The reaction assumptions of
      the two rigidity theorems come from the same conversation and a project
      note, as recorded in docs/scope-correction.md. The novelty of the
      statements has not been established by a literature search.
  - title: "Serrin's overdetermined problems on epigraphs"
    type: "paper"
    authors: ["Nicolas Beuvin", "Alberto Farina"]
    location: "https://arxiv.org/abs/2502.04812"
    relationship: "adapts"
    note: >-
      Theorem 2.1 proves the rigidity conclusion for vertically monotone
      solutions with a specified Allen-Cahn type nonlinearity: in dimension at
      most eight without further conditions, and in dimension at least nine
      when the graph has a global linear lower or upper bound. Its proof
      combines a blow-down to a perimeter-minimizing cone with results of Wang
      and Wei, and the Lean proof follows the same route. The second and third
      theorems replace the monotonicity hypothesis by the first theorem, for
      the reaction class used here.
  - title: "On Serrin's overdetermined problem and a conjecture of Berestycki, Caffarelli and Nirenberg"
    type: "paper"
    authors: ["Kelei Wang", "Juncheng Wei"]
    location: "https://arxiv.org/abs/1502.04680"
    relationship: "adapts"
    note: >-
      Theorem 1.4 proves half-space rigidity in dimension at most eight for
      vertically monotone solutions under the paper's standing assumptions
      W1-W5, which the reaction class used here satisfies (checked in
      docs/rigidity-proof/low-dimensional.md). The rigidity mechanism of its
      Section 4 underlies the flatness argument of the Lean proof.
  - title: "A new proof of Savin's theorem on Allen-Cahn equations"
    type: "paper"
    authors: ["Kelei Wang"]
    location: "https://arxiv.org/abs/1401.6480"
    relationship: "background"
    note: >-
      The tilt-excess decay (harmonic approximation) of the Lean proof follows
      the method of this paper, re-derived for the one-phase problem used here.
  - title: "Serrin's overdetermined problem and constant mean curvature surfaces"
    type: "paper"
    authors: ["Manuel del Pino", "Frank Pacard", "Juncheng Wei"]
    location: "https://arxiv.org/abs/1310.4528"
    relationship: "background"
    note: >-
      Duke Math. J. 164 (2015), 2643-2722. Constructs epigraphs in dimension at
      least nine that are not half-spaces and carry solutions of the
      overdetermined problem, which is why the third theorem needs an
      additional hypothesis on the graph.

