fidelity:
  divergences: >-
    Ambient dimension n is indexed as m+1. Euclidean norms and volume are used.
    Boundary derivatives are within the closure. The liminf is extended-real.
    Profile equality is restricted to the epigraph. No additional reaction
    assumptions or pre-existing monotonicity have been introduced.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The author checked that Challenge.lean states the intended results,
    including the reaction assumptions restored in docs/scope-correction.md.
    An earlier AI audit, docs/statement-audit.md, checked the common
    hypotheses and the shared definitions against the source images before
    that correction; it is kept as a historical record and does not cover
    RigidityHypotheses. The proofs are checked mechanically: the sandboxed
    three-kernel Comparator (Lean, NanoDa, con-ron) accepted them. No
    independent human review of the proofs is claimed.
